<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b10">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1017'/%3E%3Cg fill='none' stroke='%23ffba78' stroke-width='3'%3E%3Ccircle cx='32' cy='32' r='15'/%3E%3Cellipse cx='32' cy='32' rx='27' ry='8' transform='rotate(-32 32 32)'/%3E%3C/g%3E%3C/svg%3E">
  <title>SEABYSS</title>
  <meta name="description" content="Explore le Système solaire, observe le Soleil et suis les trajectoires de Halley, de ʻOumuamua et des sondes Voyager.">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./atlas.css">
  <link rel="stylesheet" href="./deep-atlas.css">
  <link rel="stylesheet" href="./observations.css">
  <link rel="stylesheet" href="./expeditions.css">
  <link rel="stylesheet" href="./system-view.css">
  <link rel="stylesheet" href="./body-labels.css">
  <link rel="stylesheet" href="./simulation-controls.css">
  <link rel="stylesheet" href="./sandbox-view.css">
  <link rel="stylesheet" href="./sandbox-workspace.css">
  <link rel="stylesheet" href="./sandbox-editor.css">
  <link rel="stylesheet" href="./sandbox-analysis.css">
  <link rel="stylesheet" href="./sandbox-comparison.css">
  <link rel="stylesheet" href="./climate-lab.css">
  <link rel="stylesheet" href="./climate-globe.css">
  <link rel="stylesheet" href="./climate-compare.css">
  <link rel="stylesheet" href="./climate-orbit.css">
  <link rel="stylesheet" href="./cryosphere-panel.css">
  <template id="relativity-styles">
  <link rel="stylesheet" href="./relativity-scene.css">
  <link rel="stylesheet" href="./relativity-lab.css">
  <link rel="stylesheet" href="./relativity-tides.css">
  </template>
  <template id="waves-styles">
  <link rel="stylesheet" href="./waves-lab.css">
  <link rel="stylesheet" href="./waves-view.css">
  <link rel="stylesheet" href="./waves-compare.css">
  </template>
  <template id="phase-styles"><link rel="stylesheet" href="./phase-lab.css"></template>
  <template id="traveller-styles"><link rel="stylesheet" href="./traveller-lab.css"></template>
  <template id="solar-styles"><link rel="stylesheet" href="./solar-observer.css"></template>
  <link rel="stylesheet" href="./cinema.css">
  <link rel="stylesheet" href="./sky-observer.css">
  <link rel="stylesheet" href="./surface-workspace.css">
  <link rel="stylesheet" href="./surface-atlas.css">
  <link rel="stylesheet" href="./surface-sky.css">
  <link rel="stylesheet" href="./phenomena.css">
  <link rel="stylesheet" href="./experiences.css">
  <link rel="stylesheet" href="./earth-explorer.css">
  <link rel="stylesheet" href="./landing-flight.css">
  <link rel="stylesheet" href="./photo-studio.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="masthead">
    <div class="brand" aria-label="SEABYSS">
      <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="15.5"/><ellipse cx="24" cy="24" rx="23" ry="6.1" transform="rotate(-39 24 24)"/><path d="M24 5v4m0 30v4M5 24h4m30 0h4"/><circle cx="35.8" cy="13.6" r="2.4" fill="currentColor" stroke="none"/></svg>
      <span class="brand-type"><strong>SEABYSS</strong></span>
    </div>
    <nav class="main-nav" aria-label="Navigation principale">
      <button id="system-open" class="nav-item active" aria-current="page" title="Vue du système"><i data-icon="system"></i><span>Système</span></button>
      <button id="sandbox-open" class="nav-item" title="Atelier gravitationnel · créer un système"><i data-icon="gravity"></i><span>Atelier</span></button>
      <button id="climate-open" class="nav-item" title="Laboratoire climatique"><i data-icon="climate"></i><span>Climat</span></button>
      <button id="explore-tab" class="nav-item" title="Observer un astre"><i data-icon="orbit"></i><span>Explorer</span></button>
      <button id="atlas-open" class="nav-item"><i data-icon="grid"></i><span>Atlas</span></button>
      <button id="journal-open" class="nav-item"><i data-icon="book"></i><span>Carnet</span></button>
    </nav>
    <div class="header-tools">
      <button id="help-open" class="icon-btn" aria-label="Aide et commandes" title="Aide et commandes"><i data-icon="help"></i></button>
      <button id="fullscreen" class="icon-btn" aria-label="Plein écran" title="Plein écran"><i data-icon="expand"></i></button>
    </div>
  </header>
  <main id="workspace">
    <section id="sandbox-workspace" hidden aria-label="Atelier gravitationnel"></section>
    <section id="climate-lab" hidden aria-label="Laboratoire climatique"></section>
    <section id="relativity-workspace" hidden aria-label="Laboratoire des trous noirs"></section>
    <section id="waves-workspace" hidden aria-label="Laboratoire des ondes gravitationnelles"></section>
    <section id="phase-workspace" hidden aria-label="Observatoire des phases"></section>
    <section id="traveller-workspace" hidden aria-label="Comètes et sondes"></section>
    <section id="solar-workspace" hidden aria-label="Observation du Soleil"></section>
    <section id="surface-workspace" hidden aria-label="Expédition au sol"></section>
    <section id="landing-workspace" hidden aria-label="Pilotage de la descente"></section>
    <section id="observatory" aria-label="Observatoire spatial">
      <canvas id="space" tabindex="0" aria-label="Vue spatiale 3D interactive. Commandes disponibles dans l’aide."></canvas>
      <div id="navigation-mark" hidden aria-hidden="true"></div>
      <div id="object-frame" aria-hidden="true"></div>
      <div class="scene-shade" aria-hidden="true"></div>
      <div class="stage-heading">
        <button type="button" id="capture-orbit" title="Ouvrir le studio photo" aria-label="Ouvrir le studio photo"><i data-icon="photo"></i></button>
        <button type="button" id="time-open" title="Horloge et affichage"><i data-icon="clock"></i><span>Horloge</span></button>
        <span class="indicator"></span><span id="mode-status" role="status">Observation</span>
      </div>
      <div class="target-info">
        <button id="object-dossier" class="location" title="Ouvrir la fiche de l’astre"><i data-icon="orbit"></i><span id="location">Système solaire</span><span aria-hidden="true">↗</span></button>
        <h1 id="target-name">Terre</h1>
        <p id="target-description"></p>
        <dl class="telemetry" aria-label="Télémétrie">
          <div><dt>Distance au centre</dt><dd id="distance">–</dd></div>
          <div><dt>Rayon</dt><dd id="radius">–</dd></div>
        </dl>
        <div class="hero-actions">
          <button id="enter-flight" class="primary-btn"><i data-icon="navigate"></i>Vol libre</button>
          <button id="surface-open" class="square-btn" hidden aria-label="Atterrir" title="Atterrir"><i data-icon="terrain"></i><span>Atterrir</span></button>
          <button id="earth-open" class="square-btn" hidden aria-label="Explorer la Terre" title="Explorer la Terre"><i data-icon="earth"></i><span>Terre</span></button>
          <button id="enter-cinema" class="square-btn cinema-trigger" aria-label="Vue cinéma" title="Vue cinéma"><i data-icon="cinema"></i><span>Vue cinéma</span></button>
          <button id="save-position" class="square-btn" aria-label="Enregistrer cette position" title="Enregistrer cette position"><i data-icon="bookmark"></i></button>
          <button id="photo-open" class="square-btn" hidden aria-label="Photographies de mission" title="Photographies de mission"><i data-icon="photo"></i><span>Photos</span></button>
        </div>
        <section id="earth-overflight" aria-label="Survol terrestre" hidden>
          <output id="earth-overflight-location"></output>
          <label for="earth-overflight-altitude">Altitude <select id="earth-overflight-altitude"><option value="800">800 km</option><option value="2100">2 100 km</option><option value="4800" selected>4 800 km</option><option value="12000">12 000 km</option></select></label>
          <button type="button" id="earth-overflight-light" aria-pressed="true">Éclairage de carte</button>
          <button type="button" id="earth-overflight-return">Carte terrestre</button>
        </section>
      </div>
      <section id="system-view" hidden aria-label="Vue orbitale interactive"></section>
      <button id="exit-cinema" class="square-btn" hidden title="Quitter la vue cinéma (Échap)"><i data-icon="close"></i>Quitter la vue cinéma</button>
      <div class="flight-hud" hidden>
        <div class="flight-target"><span>Cible</span><strong id="flight-name">Terre</strong><output id="flight-distance"></output></div>
        <button id="flight-lock" class="square-btn" title="Verrouiller la visée souris (L)" aria-label="Verrouiller la visée souris" aria-pressed="false"><i data-icon="drag"></i></button>
        <button id="flight-exit" class="square-btn" title="Recentrer et revenir à l’observation" aria-label="Recentrer et revenir à l’observation"><i data-icon="focus"></i></button>
      </div>
      <div class="reticle" hidden aria-hidden="true"></div>
      <div class="flight-controls" hidden>
        <div class="pad" aria-label="Déplacement">
          <button class="square-btn" data-move="left" aria-label="Gauche"><i data-icon="left"></i></button>
          <button id="thrust-forward" class="square-btn" data-move="forward" aria-label="Avancer"><i data-icon="up"></i></button>
          <button class="square-btn" data-move="right" aria-label="Droite"><i data-icon="right"></i></button>
          <button class="square-btn" data-move="down" aria-label="Descendre"><i data-icon="descend"></i></button>
          <button class="square-btn" data-move="back" aria-label="Reculer"><i data-icon="down"></i></button>
          <button class="square-btn" data-move="up" aria-label="Monter"><i data-icon="ascend"></i></button>
        </div>
        <div class="speed-panel">
          <div class="flight-readouts"><div><span>Vitesse réelle</span><strong id="flight-velocity">–</strong></div><div><span>Allure réglée</span><strong id="speed">–</strong></div></div>
          <div class="speed-actions"><button class="brake-btn" id="flight-brake" aria-label="Freiner" title="Freiner (X)">Freiner</button><button class="square-btn" id="speed-down" aria-label="Réduire la vitesse"><i data-icon="minus"></i></button><button class="square-btn" id="speed-up" aria-label="Augmenter la vitesse"><i data-icon="plus"></i></button></div>
        </div>
      </div>
    </section>
    <section class="destinations" aria-labelledby="strip-title">
      <div id="expedition-hud" hidden></div>
      <header class="strip-header"><h2 id="strip-title">Destinations</h2><span class="deck-rule" aria-hidden="true"></span><div class="strip-actions"><button id="surface-atlas-open" class="text-btn"><i data-icon="terrain"></i>Surfaces</button><button id="atlas-all" class="text-btn">Atlas <i data-icon="grid"></i></button></div></header>
      <div id="destination-strip" class="strip"></div>
    </section>
  </main>
  <dialog id="overlay" aria-labelledby="dialog-title">
    <header class="dialog-header"><h2 id="dialog-title"></h2><button id="close-dialog" class="icon-btn" aria-label="Fermer"><i data-icon="close"></i></button></header>
    <div id="dialog-body"></div>
  </dialog>
  <div id="toast" role="status"></div>
  <input type="file" id="climate-file" accept=".json,application/json" hidden>
  <noscript>Active JavaScript pour explorer l’univers.</noscript>
</body>
</html>
