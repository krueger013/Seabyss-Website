<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" fill="none" role="img" aria-labelledby="abyss-title abyss-desc">
  <title id="abyss-title">Un passage dans les profondeurs</title>
  <desc id="abyss-desc">Un portail cyan et violet suspendu dans une obscurité bleue, entouré de roches flottantes et de trois îles portant un cristal, une lune et une étoile.</desc>
