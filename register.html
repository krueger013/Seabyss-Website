<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un compte Seabyss</title>
    <meta name="description" content="Page temporaire de création de compte Seabyss.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="top-nav">
    <div class="nav-container">
        <a href="index.html" class="logo">SEABYSS</a>
        <div class="nav-links">
            <a href="index.html">Accueil</a>
            <a href="download.html">Télécharger</a>
            <a href="login.html">Connexion</a>
            <a href="register.html">Créer un compte</a>
            <a href="market.html">Marché</a>
            <a href="privacy.html">Confidentialité</a>
            <a href="support.html" class="nav-download">Support</a>
        </div>
    </div>
</nav>

<main class="page-shell">
    <section class="page-hero compact-hero">
        <div class="container narrow-container">
            <p class="eyebrow">Inscription</p>
            <h1>Créer un compte Seabyss</h1>
            <p>La création de compte sera activée plus tard.</p>
        </div>
    </section>

    <section class="section compact-section">
        <div class="container narrow-container">
            <div class="form-panel">
                <label for="register-name">Pseudo</label>
                <input id="register-name" type="text" placeholder="Nom de capitaine" disabled>

                <label for="register-email">Email</label>
                <input id="register-email" type="email" placeholder="pirate@seabyss.com" disabled>

                <label for="register-password">Mot de passe</label>
                <input id="register-password" type="password" placeholder="••••••••" disabled>

                <label for="register-confirm">Confirmation du mot de passe</label>
                <input id="register-confirm" type="password" placeholder="••••••••" disabled>

                <label class="check-row" for="register-privacy">
                    <input id="register-privacy" type="checkbox" disabled>
                    <span>J’ai lu et j’accepte la politique de confidentialité</span>
                </label>

                <button class="btn-disabled" type="button" disabled>Création bientôt disponible</button>

                <div class="text-links">
                    <a href="login.html">Déjà un compte ? Connexion</a>
                    <a href="privacy.html">Politique de confidentialité</a>
                </div>
            </div>
        </div>
    </section>
</main>

<footer>
    <p>© 2025 Seabyss - Tous droits réservés</p>
</footer>

</body>
</html>
