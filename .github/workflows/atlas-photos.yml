name: Préparer les photographies de l’atlas
on:
  push:
    branches: [release/observations-galerie-19]
    paths: ['acquisition/**', '.github/workflows/atlas-photos.yml']
permissions:
  contents: write
jobs:
  plates:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - run: python -m pip install pillow
      - run: python acquisition/fetch.py
      - name: Enregistrer les photographies vérifiées
        run: |
          if git diff --quiet && test -z "$(git ls-files --others --exclude-standard acquisition/output)"; then exit 0; fi
          git add -- acquisition/output/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Préparer les planches scientifiques de l’atlas"
          git push origin "HEAD:$GITHUB_REF_NAME"
