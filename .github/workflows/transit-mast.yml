name: Vérifier une observation TESS
on:
  push:
    branches: [release/acquisition-transit-21]
    paths: ['acquisition/get-transit.py', '.github/workflows/transit-mast.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - run: python -m pip install astropy numpy
      - run: python acquisition/get-transit.py
      - run: |
          git add -- acquisition/transit-observation.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Extraire un transit mesuré par TESS dans le secteur 56"
          git push origin "HEAD:$GITHUB_REF_NAME"
